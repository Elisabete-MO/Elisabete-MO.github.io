<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 8</title>
  <style>
    /* Botão só para estilo */
    .botao {
      padding: 10px 20px;
      background: #4a00e0;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      visibility: hidden;
      opacity: 0;
      transition: 0.3s ease;
    }

    /* Mostra o overlay quando o modal é o alvo */
    .overlay:target {
      visibility: visible;
      opacity: 1;
    }

    /* Caixa do modal */
    .modal {
      background: white;
      width: 300px;
      padding: 20px;
      border-radius: 8px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Botão de fechar */
    .fechar {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 15px;
      background: #e00;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <a href="#meuModal" class="botao">Abrir Modal</a>

  <div id="meuModal" class="overlay">
    <div class="modal">
      <h2>Modal</h2>
      <a href="#" class="fechar">Fechar</a>
    </div>
  </div>

</body>
</html>
